function emptyState(icon, title, sub, action, btnLabel){
  return '<div class="empty">' +
    '<div class="icon">'+ic(icon, 56, {strokeWidth:1.4})+'</div>' +
    '<div class="t">'+escapeHTML(title)+'</div>' +
    '<div class="s">'+escapeHTML(sub)+'</div>' +
    (action ? '<button class="btn primary" data-action="'+action+'">'+escapeHTML(btnLabel||'Добавить')+'</button>' : '') +
  '</div>';
}

/* ============================================================
   INVENTORY
============================================================ */
function viewInventory(){
  const ui = state.ui;
  let list = state.products.slice();
  const q = ui.invSearch.trim().toLowerCase();
  if(q){
    list = list.filter(p => {
      const colorsNames = (p.colors||[]).map(c=>c.name).join(' ');
      const hay = [p.name, p.sku, p.brand, p.category, p.color, colorsNames, Object.keys(p.sizes||{}).join(' ')].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(ui.invCategory) list = list.filter(p => (p.category||'') === ui.invCategory);
  if(ui.invBrand) list = list.filter(p => (p.brand||'') === ui.invBrand);
  const th = Number(state.settings.lowStock)||2;
  if(ui.invFilter === 'in') list = list.filter(p => productStockSummary(p).total > th);
  else if(ui.invFilter === 'low') list = list.filter(p => { const {total}=productStockSummary(p); return total>0 && total<=th; });
  else if(ui.invFilter === 'out') list = list.filter(p => productStockSummary(p).total === 0);
  else if(ui.invFilter === 'fav') list = list.filter(p => p.favorite);

  const sort = ui.invSort;
  list.sort((a,b)=>{
    switch(sort){
      case 'name': return (a.name||'').localeCompare(b.name||'','ru');
      case 'price-up': return (a.salePrice||0)-(b.salePrice||0);
      case 'price-down': return (b.salePrice||0)-(a.salePrice||0);
      case 'new': return (b.createdAt||0)-(a.createdAt||0);
      case 'old': return (a.createdAt||0)-(b.createdAt||0);
      case 'stock-up': return productStockSummary(a).total - productStockSummary(b).total;
      case 'stock-down': return productStockSummary(b).total - productStockSummary(a).total;
      case 'profit': return ((b.salePrice||0)-(b.purchasePrice||0)) - ((a.salePrice||0)-(a.purchasePrice||0));
      case 'popular': return (b.soldCount||0)-(a.soldCount||0);
      default: return (b.createdAt||0)-(a.createdAt||0);
    }
  });
  const categories = [...new Set(state.products.map(p=>p.category).filter(Boolean))];
  const brands = [...new Set(state.products.map(p=>p.brand).filter(Boolean))];
  const totalStock = list.reduce((s,p)=>s+productStockSummary(p).total, 0);
  const filters = [
    {k:'all', l:'Все'},
    {k:'in', l:'В наличии'},
    {k:'low', l:'Заканчивается'},
    {k:'out', l:'Нет в наличии'},
    {k:'fav', l:'Избранные'},
  ];

  return `
    <div class="topbar">
      <div>
        <div class="greet">Управление складом</div>
        <div class="title">Склад</div>
      </div>
      <button class="btn primary" data-action="quick-add-product">${ic('plus',18)} Товар</button>
    </div>

    <div class="search-wrap">
      <span class="ic">${ic('search',18)}</span>
      <input type="search" placeholder="Поиск по названию, артикулу, бренду, цвету…" value="${escapeHTML(ui.invSearch)}" data-input="inv-search">
    </div>

    <div class="filters-row">
      ${filters.map(f=>`<button class="chip ${ui.invFilter===f.k?'active':''}" data-action="inv-filter" data-value="${f.k}">${f.k==='fav'?ic('star',14):''}${f.l}</button>`).join('')}
    </div>

    <div class="filters-row">
      <select data-input="inv-category" style="min-width:140px;max-width:180px;padding:8px 32px 8px 12px">
        <option value="">Все категории</option>
        ${categories.map(c=>`<option value="${escapeHTML(c)}" ${ui.invCategory===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}
      </select>
      <select data-input="inv-brand" style="min-width:120px;max-width:160px;padding:8px 32px 8px 12px">
        <option value="">Все бренды</option>
        ${brands.map(b=>`<option value="${escapeHTML(b)}" ${ui.invBrand===b?'selected':''}>${escapeHTML(b)}</option>`).join('')}
      </select>
      <select data-input="inv-sort" style="min-width:150px;padding:8px 32px 8px 12px">
        <option value="new" ${ui.invSort==='new'?'selected':''}>Новые</option>
        <option value="old" ${ui.invSort==='old'?'selected':''}>Старые</option>
        <option value="name" ${ui.invSort==='name'?'selected':''}>По названию</option>
        <option value="price-up" ${ui.invSort==='price-up'?'selected':''}>Цена ↑</option>
        <option value="price-down" ${ui.invSort==='price-down'?'selected':''}>Цена ↓</option>
        <option value="stock-up" ${ui.invSort==='stock-up'?'selected':''}>Остаток ↑</option>
        <option value="stock-down" ${ui.invSort==='stock-down'?'selected':''}>Остаток ↓</option>
        <option value="profit" ${ui.invSort==='profit'?'selected':''}>По прибыли</option>
        <option value="popular" ${ui.invSort==='popular'?'selected':''}>Популярные</option>
      </select>
    </div>

    <div class="section-sub" style="margin-bottom:10px">${list.length} товаров · ${totalStock} шт. на складе</div>

    ${list.length === 0 ? (
      state.products.length === 0
        ? emptyState('box','Склад пока пуст','Добавьте первый товар, чтобы начать вести учёт','quick-add-product','+ Добавить товар')
        : emptyState('search','Ничего не найдено','Попробуйте изменить фильтры или поиск')
    ) : ('<div class="grid-products">' + list.map(productCard).join('') + '</div>')}
  `;
}

function productCard(p){
  const hasColors = p.colors && p.colors.length > 0;
  const img = getPhotoURL(productMainPhoto(p));
  const {total} = productStockSummary(p);
  const st = productStatus(p);
  const profit = (Number(p.salePrice)||0) - (Number(p.purchasePrice)||0);
  const sizes = productEffectiveSizes(p);
  const usedSizes = Object.keys(sizes).filter(k=>sizes[k] != null);
  return `
    <div class="product" data-action="open-product" data-id="${p.id}">
      <div class="ph">
        ${img ? `<img src="${img}" alt="${escapeHTML(p.name||'')}" loading="lazy">` : `<div class="placeholder">${ic('shirt',40,{strokeWidth:1.3})}</div>`}
        ${st.label ? `<div class="badge ${st.cls}">${ic('alert',11)}${st.label.toUpperCase()}</div>` : ''}
        <button class="badge fav ${p.favorite?'on':''}" data-action="toggle-fav" data-id="${p.id}">${p.favorite?icFilled('star',15):ic('star',15)}</button>
      </div>
      <div class="body">
        <div>
          <div class="name">${escapeHTML(p.name||'Без названия')}</div>
          ${p.brand ? `<div class="brand">${escapeHTML(p.brand)}</div>` : ''}
        </div>
        ${hasColors ? `
          <div class="color-dots">
            ${p.colors.map(c => `<span class="color-dot" style="background:${colorToCss(c.hex)}" title="${escapeHTML(c.name||'')}"></span>`).join('')}
          </div>
        ` : ''}
        <div class="prices">
          <div class="price-sale">${fmt(p.salePrice)}</div>
          ${p.purchasePrice ? `<div>закуп ${fmt(p.purchasePrice)}</div>` : ''}
        </div>
        ${profit>0 ? `<div class="price-profit">+${fmt(profit)} / шт.</div>` : ''}
        <div class="sizes-mini">
          ${usedSizes.length === 0 ? '<span class="muted" style="font-size:11.5px">Без размеров</span>' :
            usedSizes.map(k => {
              const v = sizes[k];
              return `<span class="size-chip ${v===0?'zero':''}"><span>${escapeHTML(k)}</span><span class="n">${v}</span></span>`;
            }).join('')
          }
        </div>
        <div class="prices" style="font-size:11.5px">
          <span class="muted">Всего: <b style="color:var(--text)">${total} шт.</b></span>
        </div>
        <div class="prod-actions">
          <button class="btn small" data-action="open-product" data-id="${p.id}">Открыть</button>
          <button class="btn small primary" data-action="sell" data-id="${p.id}" ${total===0?'disabled':''}>Продать</button>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   PRODUCT FORM (с цветами)
============================================================ */
function allSizes(){
  const set = new Set([...BASE_SIZES, ...state.customSizes]);
  for(const p of state.products){ for(const k in (p.sizes||{})) set.add(k); }
  return Array.from(set);
}
let formPhotos = [];
let formMainPhoto = null;
let formColors = []; // [{ id, name, hex, photos:[], mainPhoto, sizes:{} }]

function openProductForm(productId){
  const editing = productId ? state.products.find(p=>p.id===productId) : null;
  formPhotos = editing ? (editing.photos||[]).slice() : [];
  formMainPhoto = editing ? (editing.mainPhotoId || formPhotos[0] || null) : null;
  formColors = editing && Array.isArray(editing.colors)
    ? editing.colors.map(c => ({
        id: c.id || uid(),
        name: c.name || '',
        hex: c.hex || '#000000',
        photos: (c.photos||[]).slice(),
        mainPhoto: c.mainPhoto || null,
        sizes: Object.assign({}, c.sizes||{})
      }))
    : [];

  const suppliers = state.suppliers;
  const sizesList = allSizes();

  const sizesHTML = sizesList.map(sz => {
    const v = editing && editing.sizes ? editing.sizes[sz] : undefined;
    const used = v !== undefined && v !== null;
    const qty = used ? v : 0;
    return `<div class="size-row" data-size-row="${escapeHTML(sz)}">
      <div class="chk ${used?'on':''}" data-action="size-toggle">${used?ic('check',14,{strokeWidth:3}):''}</div>
      <div class="nm">${escapeHTML(sz)}</div>
      <input type="number" min="0" step="1" value="${qty}" data-size-input="${escapeHTML(sz)}" ${used?'':'disabled'}>
    </div>`;
  }).join('');

  const body =
    '<div class="form-section">' +
      '<div class="form-section-title">Фотографии товара</div>' +
      '<div class="photo-grid" id="photo-grid"></div>' +
      '<input type="file" accept="image/*" multiple id="photo-input" style="display:none">' +
      '<button class="btn small" type="button" id="add-photo-btn">'+ic('camera',16)+' Добавить фото</button>' +
    '</div>' +

    '<div class="form-section">' +
      '<div class="form-row"><label>Название *</label><input id="f-name" value="'+escapeHTML(editing?.name||'')+'" placeholder="Nike Hoodie"></div>' +
      '<div class="form-grid">' +
        '<div class="form-row"><label>Категория</label><input id="f-category" list="cat-list" value="'+escapeHTML(editing?.category||'')+'" placeholder="Худи"></div>' +
        '<div class="form-row"><label>Бренд</label><input id="f-brand" value="'+escapeHTML(editing?.brand||'')+'" placeholder="Nike"></div>' +
        '<div class="form-row"><label>Артикул</label><input id="f-sku" value="'+escapeHTML(editing?.sku||'')+'" placeholder="NT-001"></div>' +
      '</div>' +
      '<datalist id="cat-list">'+CATEGORIES.map(c=>'<option value="'+escapeHTML(c)+'">').join('')+'</datalist>' +
    '</div>' +

    '<div class="form-section">' +
      '<div class="form-section-title">Цены</div>' +
      '<div class="form-grid">' +
        '<div class="form-row"><label>Закупочная цена, '+escapeHTML(state.settings.currency)+'</label><input type="number" min="0" step="0.01" id="f-purchase" value="'+(editing?.purchasePrice||'')+'" placeholder="4500"></div>' +
        '<div class="form-row"><label>Цена продажи, '+escapeHTML(state.settings.currency)+'</label><input type="number" min="0" step="0.01" id="f-sale" value="'+(editing?.salePrice||'')+'" placeholder="7990"></div>' +
      '</div>' +
    '</div>' +

    '<div class="form-section">' +
      '<div class="form-section-title">'+ic('palette',14)+' Цвета и остатки по цветам</div>' +
      '<div class="section-sub" style="margin-bottom:10px">Прикрепите цвета (например «Белый» и «Чёрный») и укажите остатки по размерам для каждого цвета. Если не прикреплять цвета — будут использованы размеры товара ниже.</div>' +
      '<div class="color-editor" id="color-editor"></div>' +
      '<button class="btn small mt-12" type="button" id="add-color-btn">'+ic('plus',14)+' Прикрепить цвет</button>' +
    '</div>' +

    '<div class="form-section">' +
      '<div class="form-section-title">Размеры и остатки (без цветов)</div>' +
      '<div class="section-sub" style="margin-bottom:10px">Используйте, если у товара нет разделения по цветам. Если цвета заданы выше — эти поля игнорируются в остатках, но сохраняются как запас.</div>' +
      '<div class="size-editor" id="size-editor">'+sizesHTML+'</div>' +
      '<button class="btn small mt-12" type="button" id="add-custom-size">'+ic('plus',14)+' Добавить размер</button>' +
    '</div>' +

    '<div class="form-section">' +
      '<div class="form-section-title">Прочее</div>' +
      '<div class="form-grid">' +
        '<div class="form-row"><label>Поставщик</label><select id="f-supplier"><option value="">—</option>' +
          suppliers.map(s=>'<option value="'+s.id+'" '+(editing?.supplierId===s.id?'selected':'')+'>'+escapeHTML(s.name)+'</option>').join('') +
        '</select></div>' +
        '<div class="form-row"><label>Дата закупки</label><input type="date" id="f-date" value="'+escapeHTML(dateInputVal(editing?.purchaseDate || Date.now()))+'"></div>' +
      '</div>' +
      '<div class="form-grid mt-12">' +
        '<div class="form-row"><label>Количество закуплено</label><input type="number" min="0" step="1" id="f-qty" value="'+(editing?.purchaseQty||'')+'" placeholder="10"></div>' +
        '<div class="form-row"><label>Сумма закупки (всего)</label><input type="number" min="0" step="0.01" id="f-total" value="'+(editing?.purchaseTotal||'')+'" placeholder="40000"></div>' +
      '</div>' +
      '<div class="form-row"><label>Описание</label><textarea id="f-desc" placeholder="Комментарий о товаре">'+escapeHTML(editing?.description||'')+'</textarea></div>' +
    '</div>';

  openModal({
    title: editing ? 'Редактировать товар' : 'Новый товар',
    bodyHTML: body,
    footHTML:
      '<button class="btn" data-modal-close>Отмена</button>' +
      '<button class="btn primary" id="save-product">'+(editing?'Сохранить':'Добавить')+'</button>',
    onMount: (root) => {
      renderPhotoGrid(root);
      renderColorEditor(root);

      $('#add-photo-btn', root).addEventListener('click', () => $('#photo-input', root).click());
      $('#photo-input', root).addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        for(const f of files){
          try{
            const id = await addPhotoFromFile(f);
            formPhotos.push(id);
            if(!formMainPhoto) formMainPhoto = id;
          }catch(err){ console.error(err); toast('Не удалось загрузить фото','error'); }
        }
        e.target.value = '';
        renderPhotoGrid(root);
      });

      $$('[data-action="size-toggle"]', root).forEach(chk => {
        chk.addEventListener('click', () => {
          const row = chk.closest('[data-size-row]');
          const inp = row.querySelector('input[type=number]');
          const on = chk.classList.toggle('on');
          chk.innerHTML = on ? ic('check',14,{strokeWidth:3}) : '';
          inp.disabled = !on;
        });
      });

      $('#add-custom-size', root).addEventListener('click', () => {
        const name = prompt('Введите название размера (например, 4XL или 42):');
        if(!name) return;
        const clean = name.trim().toUpperCase();
        if(!clean) return;
        if(!state.customSizes.includes(clean) && !BASE_SIZES.includes(clean)) state.customSizes.push(clean);
        const ed = $('#size-editor', root);
        const row = document.createElement('div');
        row.className = 'size-row';
        row.setAttribute('data-size-row', clean);
        row.innerHTML = '<div class="chk on" data-action="size-toggle">'+ic('check',14,{strokeWidth:3})+'</div><div class="nm">'+escapeHTML(clean)+'</div><input type="number" min="0" step="1" value="0" data-size-input="'+escapeHTML(clean)+'">';
        ed.appendChild(row);
        row.querySelector('[data-action="size-toggle"]').addEventListener('click', (ev)=>{
          const c = ev.currentTarget;
          const inp = row.querySelector('input[type=number]');
          const on = c.classList.toggle('on');
          c.innerHTML = on ? ic('check',14,{strokeWidth:3}) : '';
          inp.disabled = !on;
        });
      });

      // Кнопка "Прикрепить цвет"
      $('#add-color-btn', root).addEventListener('click', () => {
        formColors.push({
          id: uid(),
          name: '',
          hex: '#cccccc',
          photos: [],
          mainPhoto: null,
          sizes: {}
        });
        renderColorEditor(root);
      });

      const qtyEl = $('#f-qty', root);
      const priceEl = $('#f-purchase', root);
      const totalEl = $('#f-total', root);
      const recalc = () => {
        const q = Number(qtyEl.value)||0;
        const p = Number(priceEl.value)||0;
        if(q && p) totalEl.value = Math.round(q*p*100)/100;
      };
      qtyEl.addEventListener('input', recalc);
      priceEl.addEventListener('input', recalc);

      // Сохранение
      $('#save-product', root).addEventListener('click', async () => {
        const name = $('#f-name', root).value.trim();
        if(!name){ toast('Укажите название товара','error'); return; }

        const sizes = {};
        $$('[data-size-input]', root).forEach(inp => {
          const sz = inp.getAttribute('data-size-input');
          const chk = inp.closest('[data-size-row]').querySelector('.chk');
          if(chk.classList.contains('on')){
            sizes[sz] = Math.max(0, Math.floor(Number(inp.value)||0));
          }
        });

        // Считываем цвета из редактора
        const colors = [];
        $$('.color-card', root).forEach(card => {
          const cid = card.getAttribute('data-color-id');
          const nameEl = card.querySelector('[data-color-name]');
          const hexEl = card.querySelector('[data-color-hex]');
          const cname = nameEl ? nameEl.value.trim() : '';
          const chex = hexEl ? hexEl.value.trim() : '#000000';
          const current = formColors.find(x=>x.id===cid);
          if(!current) return;
          colors.push({
            id: cid,
            name: cname,
            hex: chex,
            photos: current.photos.slice(),
            mainPhoto: current.mainPhoto || null,
            sizes: Object.assign({}, current.sizes)
          });
        });

        const supplierEl = $('#f-supplier', root);
        const dateEl = $('#f-date', root);
        const purchaseDate = dateEl.value ? new Date(dateEl.value).getTime() : Date.now();

        const data = {
          name,
          category: $('#f-category', root).value.trim(),
          brand: $('#f-brand', root).value.trim(),
          sku: $('#f-sku', root).value.trim(),
          color: '',
          purchasePrice: Number($('#f-purchase', root).value)||0,
          salePrice: Number($('#f-sale', root).value)||0,
          supplierId: supplierEl.value || '',
          purchaseDate,
          purchaseQty: Number($('#f-qty', root).value)||0,
          purchaseTotal: Number($('#f-total', root).value)||0,
          description: $('#f-desc', root).value.trim(),
          photos: formPhotos.slice(),
          mainPhotoId: formMainPhoto || formPhotos[0] || null,
          sizes,
          colors
        };

        if(editing){
          Object.assign(editing, data);
          recordHistory('Обновлён товар «'+name+'»');
          toast('Товар обновлён');
          sbUpsertProduct(editing);
        } else {
          const np = { id: uid(), createdAt: Date.now(), soldCount: 0, favorite:false, ...data };
          state.products.push(np);
          recordHistory('Добавлен товар «'+name+'»');
          toast('Товар добавлен');
          sbUpsertProduct(np);
        }
        save();
        closeModal(root);
        render();
      });
    }
  });
}

function renderPhotoGrid(root){
  const grid = $('#photo-grid', root);
  if(!grid) return;
  grid.innerHTML = formPhotos.map(id => {
    const url = getPhotoURL(id);
    const isMain = id === formMainPhoto;
    return '<div class="photo-item '+(isMain?'main':'')+'" data-photo-id="'+id+'">' +
      '<img src="'+url+'" alt="">' +
      (isMain ? '<div class="main-tag">Главное</div>' : '') +
      '<button class="del" data-action="photo-del" data-id="'+id+'">'+ic('x',12,{strokeWidth:3})+'</button>' +
    '</div>';
  }).join('') + '<button class="photo-add" type="button" id="photo-add-inline">'+ic('plus',22)+'</button>';

  const addBtn = grid.querySelector('#photo-add-inline');
  if(addBtn) addBtn.addEventListener('click', () => $('#photo-input', root).click());
  grid.querySelectorAll('[data-action="photo-del"]').forEach(b => {
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-id');
      formPhotos = formPhotos.filter(x=>x!==id);
      try{ await idbDel(id); }catch(err){}
      if(photoURLs[id]){ URL.revokeObjectURL(photoURLs[id]); delete photoURLs[id]; }
      if(supabase){ try{ await supabase.storage.from(SUPABASE_CONFIG.bucket).remove([id]); }catch(e){} }
      if(formMainPhoto === id) formMainPhoto = formPhotos[0] || null;
      renderPhotoGrid(root);
    });
  });
  grid.querySelectorAll('.photo-item').forEach(it => {
    it.addEventListener('click', (e) => {
      if(e.target.closest('[data-action="photo-del"]')) return;
      formMainPhoto = it.getAttribute('data-photo-id');
      renderPhotoGrid(root);
    });
  });
}

/* --- Рендер редактора цветов внутри формы товара --- */
function renderColorEditor(root){
  const ed = $('#color-editor', root);
  if(!ed) return;
  const sizesList = allSizes();

  ed.innerHTML = formColors.map((c, idx) => {
    const sizesHTML = sizesList.map(sz => {
      const v = c.sizes[sz];
      const val = (v == null) ? '' : v;
      return `<div class="color-size-row">
        <span class="sz-nm">${escapeHTML(sz)}</span>
        <input type="number" min="0" step="1" value="${val}" placeholder="—" data-color-size data-color="${c.id}" data-size="${escapeHTML(sz)}">
      </div>`;
    }).join('');

    const photosHTML = c.photos.map(pid => {
      const url = getPhotoURL(pid);
      const isMain = pid === c.mainPhoto;
      return '<div class="color-photo '+(isMain?'main':'')+'" data-color-photo data-color="'+c.id+'" data-photo="'+pid+'">' +
        '<img src="'+url+'" alt="">' +
        (isMain ? '<span style="position:absolute;bottom:2px;left:2px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px">Гл.</span>' : '') +
        '<button class="del-p" data-color-photo-del data-color="'+c.id+'" data-photo="'+pid+'" type="button">'+ic('x',10,{strokeWidth:3})+'</button>' +
      '</div>';
    }).join('') + '<button class="color-photo-add" type="button" data-color-add-photo data-color="'+c.id+'">'+ic('plus',18)+'</button>';

    return `<div class="color-card" data-color-id="${c.id}">
      <div class="color-card-head">
        <input type="color" value="${escapeHTML(c.hex||'#000000')}" data-color-hex>
        <input class="cname" placeholder="Название цвета (Белый)" value="${escapeHTML(c.name||'')}" data-color-name>
        <button class="del-c" type="button" data-color-del data-color="${c.id}">${ic('trash',14)}</button>
      </div>
      <div style="font-size:12px;color:var(--text-3);font-weight:600">Фото для этого цвета:</div>
      <div class="color-photo-grid" data-color-photogrid="${c.id}">
        ${photosHTML}
      </div>
      <div style="font-size:12px;color:var(--text-3);font-weight:600;margin-top:4px">Остатки по размерам (пусто = нет размера):</div>
      <div class="color-sizes">${sizesHTML}</div>
      <input type="file" accept="image/*" multiple data-color-file="${c.id}" style="display:none">
    </div>`;
  }).join('');

  // --- Обработчики ---
  // Изменение hex / name
  ed.querySelectorAll('[data-color-hex]').forEach(inp => {
    inp.addEventListener('input', () => {
      const card = inp.closest('.color-card');
      const cid = card.getAttribute('data-color-id');
      const c = formColors.find(x=>x.id===cid);
      if(c) c.hex = inp.value;
    });
  });
  ed.querySelectorAll('[data-color-name]').forEach(inp => {
    inp.addEventListener('input', () => {
      const card = inp.closest('.color-card');
      const cid = card.getAttribute('data-color-id');
      const c = formColors.find(x=>x.id===cid);
      if(c) c.name = inp.value;
    });
  });
  // Размеры
  ed.querySelectorAll('[data-color-size]').forEach(inp => {
    inp.addEventListener('input', () => {
      const cid = inp.getAttribute('data-color');
      const sz = inp.getAttribute('data-size');
      const c = formColors.find(x=>x.id===cid);
      if(!c) return;
      const raw = inp.value.trim();
      if(raw === ''){ delete c.sizes[sz]; }
      else { c.sizes[sz] = Math.max(0, Math.floor(Number(raw)||0)); }
    });
  });
  // Удалить цвет
  ed.querySelectorAll('[data-color-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid = btn.getAttribute('data-color');
      confirmDialog('Удалить цвет?','Цвет и его остатки будут удалены.', () => {
        formColors = formColors.filter(x=>x.id!==cid);
        renderColorEditor(root);
      }, 'Удалить');
    });
  });
  // Выбрать главное фото цвета
  ed.querySelectorAll('[data-color-photo]').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-color-photo-del]')) return;
      const cid = el.getAttribute('data-color');
      const pid = el.getAttribute('data-photo');
      const c = formColors.find(x=>x.id===cid);
      if(c){ c.mainPhoto = pid; renderColorEditor(root); }
    });
  });
  // Удалить фото цвета
  ed.querySelectorAll('[data-color-photo-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const cid = btn.getAttribute('data-color');
      const pid = btn.getAttribute('data-photo');
      const c = formColors.find(x=>x.id===cid);
      if(!c) return;
      c.photos = c.photos.filter(x=>x!==pid);
      if(c.mainPhoto === pid) c.mainPhoto = c.photos[0] || null;
      try{ await idbDel(pid); }catch(err){}
      if(photoURLs[pid]){ URL.revokeObjectURL(photoURLs[pid]); delete photoURLs[pid]; }
      if(supabase){ try{ await supabase.storage.from(SUPABASE_CONFIG.bucket).remove([pid]); }catch(e){} }
      renderColorEditor(root);
    });
  });
  // Добавить фото к цвету
  ed.querySelectorAll('[data-color-add-photo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid = btn.getAttribute('data-color');
      const fileInput = ed.querySelector('[data-color-file="'+cid+'"]');
      if(fileInput) fileInput.click();
    });
  });
  // Обработка загрузки файлов
  ed.querySelectorAll('[data-color-file]').forEach(fi => {
    fi.addEventListener('change', async (e) => {
      const cid = fi.getAttribute('data-color-file');
      const c = formColors.find(x=>x.id===cid);
      if(!c){ e.target.value = ''; return; }
      const files = Array.from(e.target.files || []);
      for(const f of files){
        try{
          const id = await addPhotoFromFile(f);
          c.photos.push(id);
          if(!c.mainPhoto) c.mainPhoto = id;
        }catch(err){ console.error(err); toast('Не удалось загрузить фото','error'); }
      }
      e.target.value = '';
      renderColorEditor(root);
    });
  });
}

/* ============================================================
   PRODUCT DETAIL
============================================================ */
function openProductDetail(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const hasColors = p.colors && p.colors.length > 0;

  // Определяем стартовый цвет
  let selectedColorId = hasColors ? p.colors[0].id : null;

  const renderBody = () => {
    // Фото
    let photos;
    let mainIdx = 0;
    if(hasColors && selectedColorId){
      const c = p.colors.find(x=>x.id===selectedColorId);
      photos = c ? (c.photos||[]).slice() : [];
      const mp = c ? (c.mainPhoto || photos[0] || null) : null;
      mainIdx = Math.max(0, photos.indexOf(mp));
      if(mp && photos.indexOf(mp) > 0){
        photos = [mp, ...photos.filter(x=>x!==mp)];
        mainIdx = 0;
      }
    } else {
      photos = (p.photos||[]).slice();
      mainIdx = Math.max(0, photos.indexOf(p.mainPhotoId || photos[0]));
    }

    const {total} = productStockSummary(p);
    const st = productStatus(p);
    const profit = (Number(p.salePrice)||0) - (Number(p.purchasePrice)||0);
    const supplier = state.suppliers.find(s=>s.id===p.supplierId);

    // Размеры — с учётом цвета
    let sizes = {};
    if(hasColors && selectedColorId){
      const c = p.colors.find(x=>x.id===selectedColorId);
      sizes = c ? (c.sizes||{}) : {};
    } else {
      sizes = p.sizes || {};
    }
    const sortedSizes = allSizes().filter(sz => sz in sizes);

    const history = state.history.filter(h => h.text && h.text.includes(p.name)).slice(-20).reverse();
    const productOrders = state.orders.filter(o=>o.productId === p.id).sort((a,b)=>b.date-a.date).slice(0,20);

    return (photos.length ? `
      <div class="gallery">
        ${photos.map(id=>`<div class="slide"><img src="${getPhotoURL(id)}" alt=""></div>`).join('')}
      </div>
      <div class="gallery-dots">
        ${photos.map((_,i)=>`<span class="d ${i===mainIdx?'on':''}"></span>`).join('')}
      </div>
    ` : `<div class="gallery-placeholder">${ic('shirt',64,{strokeWidth:1.3})}</div>`)
    +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">' +
      (st.label ? '<span class="status '+st.cls+'">'+ic('alert',11)+' '+st.label+'</span>' : '<span class="status green">В наличии</span>') +
      (p.favorite ? '<span class="status yellow">'+icFilled('star',11)+' Избранное</span>' : '') +
    '</div>' +
    '<div class="section-title" style="font-size:22px;margin-bottom:2px">'+escapeHTML(p.name||'')+'</div>' +
    '<div class="section-sub" style="margin-bottom:10px">' + [p.brand, p.category].filter(Boolean).map(escapeHTML).join(' · ') + '</div>' +

    (hasColors ? `
      <div class="form-section-title">${ic('palette',14)} Цвета</div>
      <div class="color-row">
        ${p.colors.map(c => {
          const active = c.id === selectedColorId;
          const q = colorTotal(c);
          return `<button class="color-item ${active?'active':''}" data-action="select-color" data-id="${p.id}" data-color="${c.id}" type="button">
            <span class="sw" style="background:${colorToCss(c.hex)}"></span>
            <span class="nm">${escapeHTML(c.name||'')}</span>
            <span class="qty">${q} шт.</span>
          </button>`;
        }).join('')}
      </div>
    ` : '') +

    '<div class="info-list" style="margin-bottom:14px">' +
      (p.sku ? '<div class="info-item"><div class="k">Артикул</div><div class="v">'+escapeHTML(p.sku)+'</div></div>' : '') +
      (p.purchasePrice ? '<div class="info-item"><div class="k">Закупка</div><div class="v">'+fmt(p.purchasePrice)+'</div></div>' : '') +
      (p.salePrice ? '<div class="info-item"><div class="k">Продажа</div><div class="v">'+fmt(p.salePrice)+'</div></div>' : '') +
      (profit>0 ? '<div class="info-item"><div class="k">Прибыль / шт.</div><div class="v" style="color:var(--green)">+'+fmt(profit)+'</div></div>' : '') +
      '<div class="info-item"><div class="k">Всего на складе</div><div class="v">'+total+' шт.</div></div>' +
      (hasColors ? '<div class="info-item"><div class="k">Цветов</div><div class="v">'+p.colors.length+'</div></div>' : '') +
      (p.purchaseQty ? '<div class="info-item"><div class="k">Закуплено</div><div class="v">'+p.purchaseQty+' шт.</div></div>' : '') +
      (p.purchaseTotal ? '<div class="info-item"><div class="k">Сумма закупки</div><div class="v">'+fmt(p.purchaseTotal)+'</div></div>' : '') +
      (supplier ? '<div class="info-item"><div class="k">Поставщик</div><div class="v">'+escapeHTML(supplier.name)+'</div></div>' : '') +
      (p.purchaseDate ? '<div class="info-item"><div class="k">Дата закупки</div><div class="v">'+fmtDate(p.purchaseDate)+'</div></div>' : '') +
      (p.description ? '<div class="info-item"><div class="k">Описание</div><div class="v" style="font-weight:500;max-width:60%">'+escapeHTML(p.description)+'</div></div>' : '') +
    '</div>' +

    '<div class="form-section-title mt-16">'+(hasColors ? 'Остатки по размерам (выбранный цвет)' : 'Остатки по размерам')+'</div>' +
    '<div class="card tight" style="margin-bottom:14px" id="quick-stock">' +
      (sortedSizes.length === 0 ? '<div class="muted center" style="padding:10px">Размеры не заданы</div>' :
      sortedSizes.map(sz => {
        const v = sizes[sz];
        return '<div class="stock-row" data-size="'+escapeHTML(sz)+'">' +
          '<div class="sz">'+escapeHTML(sz)+'</div>' +
          '<div class="ctl">' +
            (v===0 ? '<span class="none">0 · закончился</span>' : '') +
            '<button class="pm" data-action="stock-dec" data-id="'+p.id+'" data-size="'+escapeHTML(sz)+'" data-color="'+(selectedColorId||'')+'">'+ic('minus',14,{strokeWidth:2.5})+'</button>' +
            '<div class="val '+(v===0?'zero':'')+'">'+v+'</div>' +
            '<button class="pm" data-action="stock-inc" data-id="'+p.id+'" data-size="'+escapeHTML(sz)+'" data-color="'+(selectedColorId||'')+'">'+ic('plus',14,{strokeWidth:2.5})+'</button>' +
          '</div>' +
        '</div>';
      }).join(''))
    +
    '</div>' +

    (productOrders.length ? (
      '<div class="form-section-title mt-16">Продажи</div>' +
      '<div class="hist" style="margin-bottom:14px">' +
        productOrders.map(o=>'<div class="hist-item"><div class="hist-time">'+fmtDateTime(o.date)+' · №'+escapeHTML(o.number||'')+'</div>' +
          (o.colorName?'Цвет '+escapeHTML(o.colorName)+' · ':'')+'Размер '+escapeHTML(o.size||'—')+' × '+o.quantity+' = '+fmt(o.total)+' '+
          '<span class="status '+STATUS_CLASS[o.status]+'">'+escapeHTML(o.status)+'</span></div>').join('') +
      '</div>'
    ) : '') +

    (history.length ? (
      '<div class="form-section-title mt-16">История операций</div>' +
      '<div class="hist">' +
        history.map(h=>'<div class="hist-item"><div class="hist-time">'+fmtDateTime(h.ts)+'</div>'+escapeHTML(h.text)+'</div>').join('') +
      '</div>'
    ) : '');
  };

  openModal({
    title: 'Товар',
    bodyHTML: renderBody(),
    footHTML:
      '<button class="btn" data-action="edit-product" data-id="'+p.id+'">'+ic('edit',16)+' Изменить</button>' +
      '<button class="btn danger" data-action="delete-product" data-id="'+p.id+'">'+ic('trash',16)+'</button>' +
      '<button class="btn primary" data-action="sell" data-id="'+p.id+'" '+(productStockSummary(p).total===0?'disabled':'')+'>Продать</button>',
    onMount: (root) => {
      // Скролл галереи обновляет точки
      root.addEventListener('scroll', (e) => {
        const gal = e.target.closest && e.target.closest('.gallery');
      }, true);

      const attachGallery = () => {
        const gal = root.querySelector('.gallery');
        const dots = root.querySelectorAll('.gallery-dots .d');
        if(gal && dots.length){
          gal.addEventListener('scroll', () => {
            const idx = Math.round(gal.scrollLeft / gal.clientWidth);
            dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
          });
        }
      };
      attachGallery();

      // Клик по цвету — обновляем содержимое модалки
      root.addEventListener('click', (e) => {
        const t = e.target.closest('[data-action="select-color"]');
        if(!t) return;
        selectedColorId = t.getAttribute('data-color');
        const body = root.querySelector('.modal-body');
        if(body){
          body.innerHTML = renderBody();
          attachGallery();
        }
      });
    }
  });
}

/* ============================================================
   STOCK ± — учитывает цвет
============================================================ */
function changeStock(productId, size, delta, colorId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;

  if(colorId){
    const c = (p.colors||[]).find(x=>x.id===colorId);
    if(!c || !c.sizes) return;
    const cur = c.sizes[size];
    if(cur == null) return;
    const next = Math.max(0, cur + delta);
    if(next === cur) return;
    c.sizes[size] = next;
    recordHistory((delta>0?'Добавлено ':'Убавлено ') + Math.abs(delta) + ' шт. размера ' + size + ' цвета «'+(c.name||'')+'» · ' + (p.name||''));
  } else {
    if(!p.sizes || !(size in p.sizes)) return;
    const cur = p.sizes[size];
    if(cur == null) return;
    const next = Math.max(0, cur + delta);
    if(next === cur) return;
    p.sizes[size] = next;
    recordHistory((delta>0?'Добавлено ':'Убавлено ') + Math.abs(delta) + ' шт. размера ' + size + ' · ' + (p.name||''));
  }

  save();
  sbUpsertProduct(p);
  toast((delta>0?'+':'−') + Math.abs(delta) + ' · ' + size);
  if(modalStack.length){
    const top = modalStack[modalStack.length-1];
    if(top.querySelector('#quick-stock')){
      closeModal(top);
      openProductDetail(productId);
    }
  } else render();
}

/* ============================================================
   SALE MODAL — с выбором цвета
============================================================ */
function openSaleModal(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const hasColors = p.colors && p.colors.length > 0;

  // Список цветов, где есть хоть какой-то остаток
  const availColors = hasColors
    ? p.colors.filter(c => colorTotal(c) > 0)
    : [];

  if(hasColors && availColors.length === 0){ toast('Нет товара в наличии','error'); return; }
  if(!hasColors){
    const sizes = Object.keys(p.sizes||{}).filter(k => (p.sizes[k]||0) > 0);
    if(sizes.length === 0){ toast('Нет товара в наличии','error'); return; }
  }

  let selectedColorId = hasColors ? availColors[0].id : null;

  const sizeOptionsHTML = () => {
    let sizesList = [];
    if(hasColors && selectedColorId){
      const c = p.colors.find(x=>x.id===selectedColorId);
      const s = c ? (c.sizes||{}) : {};
      sizesList = Object.keys(s).filter(k => (s[k]||0) > 0).map(k=>({sz:k, q:s[k]}));
    } else {
      const s = p.sizes || {};
      sizesList = Object.keys(s).filter(k => (s[k]||0) > 0).map(k=>({sz:k, q:s[k]}));
    }
    if(sizesList.length === 0) return '<option value="">— нет размеров —</option>';
    return sizesList.map(x=>`<option value="${escapeHTML(x.sz)}">${escapeHTML(x.sz)} · в наличии ${x.q}</option>`).join('');
  };

  const body =
    '<div class="form-row"><label>Товар</label><input value="'+escapeHTML(p.name||'')+'" disabled></div>' +
    (hasColors ? `
      <div class="form-row"><label>Цвет</label>
        <select id="sale-color">
          ${availColors.map(c=>`<option value="${c.id}">${escapeHTML(c.name||'Без названия')} · в наличии ${colorTotal(c)}</option>`).join('')}
        </select>
      </div>
    ` : '') +
    '<div class="form-row"><label>Размер</label><select id="sale-size">' +
      sizeOptionsHTML() +
    '</select></div>' +
    '<div class="form-grid">' +
      '<div class="form-row"><label>Количество</label><input type="number" min="1" step="1" id="sale-qty" value="1"></div>' +
      '<div class="form-row"><label>Цена за единицу</label><input type="number" min="0" step="0.01" id="sale-price" value="'+(p.salePrice||'')+'"></div>' +
    '</div>' +
    '<div class="form-grid">' +
      '<div class="form-row"><label>Доставка</label><input type="number" min="0" step="0.01" id="sale-delivery" value="0"></div>' +
      '<div class="form-row"><label>Клиент</label><input id="sale-customer" placeholder="Имя / ник"></div>' +
    '</div>' +
    '<div class="form-row"><label>Статус</label><select id="sale-status">' +
      ORDER_STATUSES.map(s=>'<option value="'+s+'" '+(s==='Оплачен'?'selected':'')+'>'+s+'</option>').join('') +
    '</select></div>' +
    '<div class="form-row"><label>Служба доставки</label><select id="sale-service">' +
      '<option value="">—</option>' +
      DELIVERY_SERVICES.map(s=>'<option value="'+s+'">'+s+'</option>').join('') +
    '</select></div>' +
    '<div class="form-row"><label>Трек-номер</label><input id="sale-track" placeholder="1234567890"></div>' +
    '<div class="card tight mt-12" id="sale-total"><b>Итого: '+fmt((p.salePrice||0))+'</b></div>';

  openModal({
    title: 'Продажа',
    bodyHTML: body,
    footHTML:
      '<button class="btn" data-modal-close>Отмена</button>' +
      '<button class="btn primary" id="sale-confirm">Оформить</button>',
    onMount: (root) => {
      const colorEl = $('#sale-color', root);
      const sizeEl = $('#sale-size', root);
      const qtyEl = $('#sale-qty', root);
      const priceEl = $('#sale-price', root);
      const delEl = $('#sale-delivery', root);

      const getCurrentMax = () => {
        if(hasColors && selectedColorId){
          const c = p.colors.find(x=>x.id===selectedColorId);
          const s = c ? (c.sizes||{}) : {};
          return s[sizeEl.value] || 0;
        }
        return p.sizes[sizeEl.value] || 0;
      };

      const recalc = () => {
        const q = Math.max(1, Number(qtyEl.value)||1);
        const pr = Number(priceEl.value)||0;
        const dl = Number(delEl.value)||0;
        $('#sale-total', root).innerHTML = '<b>Итого: '+fmt(q*pr + dl)+'</b>';
      };

      if(colorEl){
        colorEl.addEventListener('change', () => {
          selectedColorId = colorEl.value;
          sizeEl.innerHTML = sizeOptionsHTML();
          qtyEl.max = getCurrentMax();
          if(Number(qtyEl.value) > qtyEl.max) qtyEl.value = qtyEl.max || 1;
          recalc();
        });
      }
      sizeEl.addEventListener('change', () => {
        const max = getCurrentMax();
        if(Number(qtyEl.value) > max) qtyEl.value = max;
        qtyEl.max = max;
      });
      [qtyEl, priceEl, delEl].forEach(e=>e.addEventListener('input', recalc));
      qtyEl.max = getCurrentMax();
      recalc();

      $('#sale-confirm', root).addEventListener('click', () => {
        const size = sizeEl.value;
        if(!size){ toast('Выберите размер','error'); return; }
        const qty = Math.max(1, Math.floor(Number(qtyEl.value)||1));
        const price = Number(priceEl.value)||0;
        const delivery = Number(delEl.value)||0;

        let cur;
        let colorName = '';
        if(hasColors && selectedColorId){
          const c = p.colors.find(x=>x.id===selectedColorId);
          if(!c){ toast('Цвет не найден','error'); return; }
          cur = c.sizes[size] || 0;
          colorName = c.name || '';
        } else {
          cur = p.sizes[size] || 0;
        }

        if(qty > cur){ toast('Недостаточно товара: '+cur+' шт.','error'); return; }

        const customer = $('#sale-customer', root).value.trim();
        const status = $('#sale-status', root).value;
        const service = $('#sale-service', root).value;
        const track = $('#sale-track', root).value.trim();

        // Уменьшаем остаток
        if(hasColors && selectedColorId){
          const c = p.colors.find(x=>x.id===selectedColorId);
          c.sizes[size] = cur - qty;
        } else {
          p.sizes[size] = cur - qty;
        }
        p.soldCount = (p.soldCount||0) + qty;

        const order = {
          id: uid(),
          number: nextOrderNumber(),
          date: Date.now(),
          productId: p.id,
          productName: p.name,
          productSku: p.sku || '',
          photoId: hasColors && selectedColorId
            ? (p.colors.find(x=>x.id===selectedColorId)?.mainPhoto || p.colors.find(x=>x.id===selectedColorId)?.photos?.[0] || null)
            : (p.mainPhotoId || (p.photos&&p.photos[0]) || null),
          size, quantity: qty, price,
          purchasePrice: Number(p.purchasePrice)||0,
          deliveryCost: delivery,
          total: qty*price + delivery,
          profit: (price - (Number(p.purchasePrice)||0)) * qty,
          status, deliveryService: service, trackNumber: track, customer,
          colorName
        };
        state.orders.push(order);
        recordHistory('Продан товар «'+p.name+'»'+(colorName?' ('+colorName+')':'')+', размер '+size+' × '+qty+' на '+fmt(order.total));
        save();
        sbUpsertProduct(p);
        sbUpsertOrder(order);
        toast('Продажа зарегистрирована');
        closeModal(root);
        render();
      });
    }
  });
}
function nextOrderNumber(){
  const n = state.orders.length + 1;
  const d = new Date();
  return String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + '-' + String(n).padStart(4,'0');
}

   IMPORT / EXPORT
============================================================ */
async function exportData(){
  try{
    const photos = {};
    const keys = await idbKeys();
    for(const k of keys){
      const blob = await idbGet(k);
      if(!blob) continue;
      photos[k] = await blobToDataURL(blob);
    }
    const data = {
      version: 3, exportedAt: Date.now(),
      products: state.products, orders: state.orders, expenses: state.expenses,
      suppliers: state.suppliers, history: state.history, customSizes: state.customSizes,
      settings: state.settings, photos
    };
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shop-backup-' + dateInputVal(Date.now()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('Резервная копия создана');
  }catch(e){ console.error(e); toast('Ошибка экспорта: '+e.message,'error'); }
}
function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = e=>rej(e);
    r.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataURL){
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function importData(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.products)){ toast('Неверный формат файла','error'); return; }
    if(data.photos){
      for(const [id, dataURL] of Object.entries(data.photos)){
        try{
          const blob = dataURLToBlob(dataURL);
          await idbPut(id, blob);
          if(photoURLs[id]) URL.revokeObjectURL(photoURLs[id]);
          photoURLs[id] = URL.createObjectURL(blob);
          if(supabase){
            await supabase.storage.from(SUPABASE_CONFIG.bucket).upload(id, blob, { contentType:'image/jpeg', upsert:true });
          }
        }catch(e){ console.warn('photo import', id, e); }
      }
    }
    state.products = data.products || [];
    state.orders = data.orders || [];
    state.expenses = data.expenses || [];
    state.suppliers = data.suppliers || [];
    state.history = data.history || [];
    state.customSizes = data.customSizes || [];
    if(data.settings) Object.assign(state.settings, data.settings);
    save(); applyTheme();
    if(supabase){
      toast('Загрузка в облако…','info');
      try{
        if(state.suppliers.length) await supabase.from('suppliers').upsert(state.suppliers.map(supplierToDb));
        if(state.products.length) await supabase.from('products').upsert(state.products.map(productToDb));
        if(state.orders.length) await supabase.from('orders').upsert(state.orders.map(orderToDb));
        if(state.expenses.length) await supabase.from('expenses').upsert(state.expenses.map(expenseToDb));
      }catch(e){ console.warn('import sync', e); }
    }
    toast('Данные импортированы');
    render();
  }catch(e){ console.error(e); toast('Ошибка импорта: '+e.message,'error'); }
}
async function resetAllData(){
  state.products = []; state.orders = []; state.expenses = [];
  state.suppliers = []; state.history = []; state.customSizes = [];
  try{
    const keys = await idbKeys();
    for(const k of keys) await idbDel(k);
  }catch(e){}
  Object.keys(photoURLs).forEach(k=>{ URL.revokeObjectURL(photoURLs[k]); delete photoURLs[k]; });
  save();
  if(supabase){
    try{
      await supabase.from('products').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await supabase.from('orders').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await supabase.from('expenses').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await supabase.from('suppliers').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await supabase.from('history').delete().neq('id','00000000-0000-0000-0000-000000000000');
    }catch(e){}
  }
  toast('Все данные удалены');
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const view = el.dataset.view;

  if(!auth.isAdmin){
    if(action === 'guest-open'){ e.preventDefault(); openGuestProduct(id); }
    else if(action === 'guest-cat'){ state.ui.guestCategory = el.dataset.value || ''; render(); }
    return;
  }

  switch(action){
    case 'nav':
    case 'nav-sheet':
      e.preventDefault(); closeAllModals(); setView(view); break;
    case 'more':
      e.preventDefault(); openMoreSheet(); break;
    case 'set-period':
      state.ui.period = el.dataset.period; save(); render(); break;
    case 'quick-add-product': closeAllModals(); openProductForm(); break;
    case 'quick-sell':
    case 'quick-add-order': closeAllModals(); openProductPicker(); break;
    case 'quick-add-expense': closeAllModals(); openExpenseForm(); break;
    case 'inv-filter': state.ui.invFilter = el.dataset.value; save(); render(); break;
    case 'open-product':
      e.preventDefault(); e.stopPropagation();
      openProductDetail(id); break;
    case 'toggle-fav':
      e.preventDefault(); e.stopPropagation();
      {
        const p = state.products.find(x=>x.id===id);
        if(p){ p.favorite = !p.favorite; save(); sbUpsertProduct(p); toast(p.favorite?'В избранном':'Убрано из избранного'); render(); }
      } break;
    case 'edit-product':
      { const p = state.products.find(x=>x.id===id); closeAllModals(); if(p) openProductForm(p.id); } break;
    case 'delete-product':
      {
        const p = state.products.find(x=>x.id===id);
        closeAllModals();
        if(!p) break;
        confirmDialog('Удалить товар?',
          'Вы уверены, что хотите удалить «'+(p.name||'')+'»? История продаж и заказы сохранятся.',
          () => {
            const allPhotos = new Set();
            (p.photos||[]).forEach(x=>allPhotos.add(x));
            (p.colors||[]).forEach(c => (c.photos||[]).forEach(x=>allPhotos.add(x)));
            allPhotos.forEach(pid => {
              idbDel(pid).catch(()=>{});
              if(photoURLs[pid]){ URL.revokeObjectURL(photoURLs[pid]); delete photoURLs[pid]; }
              if(supabase){ supabase.storage.from(SUPABASE_CONFIG.bucket).remove([pid]).catch(()=>{}); }
            });
            state.products = state.products.filter(x=>x.id!==id);
            recordHistory('Удалён товар «'+(p.name||'')+'»');
            save(); sbDeleteProduct(id); toast('Товар удалён'); render();
          }, 'Удалить');
      } break;
    case 'sell':
      e.preventDefault(); e.stopPropagation();
      closeAllModals(); openSaleModal(id); break;
    case 'stock-inc': changeStock(id, el.dataset.size, +1, el.dataset.color || null); break;
    case 'stock-dec': changeStock(id, el.dataset.size, -1, el.dataset.color || null); break;
    case 'open-order': openOrderDetail(id); break;
    case 'edit-expense': openExpenseForm(id); break;
    case 'add-supplier': openSupplierForm(); break;
    case 'edit-supplier': closeAllModals(); openSupplierForm(id); break;
    case 'open-supplier': openSupplierDetail(id); break;
    case 'set-theme': state.settings.theme = el.dataset.value; save(); applyTheme(); render(); break;
    case 'export-data': exportData(); break;
    case 'import-data': $('#import-file').click(); break;
    case 'sync-now':
      (async () => {
        toast('Синхронизация…','info');
        const ok = await supabaseLoadAll();
        if(ok){ toast('Синхронизировано'); render(); }
        else toast('Ошибка синхронизации','error');
      })();
      break;
    case 'reset-data':
      closeAllModals();
      confirmDialog('Удалить ВСЕ данные?','ВНИМАНИЕ! Все товары, заказы, расходы и фотографии будут удалены. Это действие необратимо.', () => {
        confirmDialog('Вы точно уверены?','Второе подтверждение для безопасности.', resetAllData, 'Да, удалить всё');
      }); break;
    case 'clear-history':
      confirmDialog('Очистить историю?','Записи истории будут удалены.', () => {
        state.history = []; save(); sbClearHistory(); toast('История очищена'); render();
      }); break;
  }
});

  if(el.dataset && el.dataset.input === 'inv-category'){ state.ui.invCategory = el.value; save(); render(); }
  else if(el.dataset && el.dataset.input === 'inv-brand'){ state.ui.invBrand = el.value; save(); render(); }
  else if(el.dataset && el.dataset.input === 'inv-sort'){ state.ui.invSort = el.value; save(); render(); }
  else if(el.id === 'set-currency'){ state.settings.currency = el.value; save(); toast('Валюта обновлена'); render(); }
  else if(el.id === 'set-low'){ const v = Math.max(1, Number(el.value)||2); state.settings.lowStock = v; save(); toast('Порог обновлён'); render(); }
  else if(el.id === 'import-file'){
    const f = el.files && el.files[0];
    if(f) confirmDialog('Импорт данных','Импорт заменит текущие данные. Продолжить?', () => importData(f), 'Импортировать');
    el.value = '';
  }
});

/* ============================================================
   PRODUCT PICKER
============================================================ */
function openProductPicker(){
  const list = state.products.filter(p => productStockSummary(p).total > 0);
  const body = list.length === 0
    ? emptyState('box','Нет товара в наличии','Сначала добавьте товар на склад')
    : '<div class="search-wrap"><span class="ic">'+ic('search',18)+'</span><input id="picker-search" placeholder="Поиск товара"></div>' +
      '<div id="picker-list">' +
        list.map(p => {
          const img = getPhotoURL(productMainPhoto(p));
          return '<div class="row" data-action="picker-choose" data-id="'+p.id+'">' +
            (img ? '<img class="avatar" src="'+img+'" alt="">' : '<div class="avatar">'+ic('shirt',20)+'</div>') +
            '<div class="info"><div class="row-t">'+escapeHTML(p.name||'')+'</div>' +
              '<div class="row-s">'+productStockSummary(p).total+' шт. · '+fmt(p.salePrice)+'</div>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';

  openModal({
    title:'Выберите товар',
    bodyHTML: body,
    onMount: (root) => {
      const search = $('#picker-search', root);
      if(search) search.addEventListener('input', () => {
        const q = search.value.trim().toLowerCase();
        $$('#picker-list .row', root).forEach(r => {
          r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      });
      $$('[data-action="picker-choose"]', root).forEach(el => {
        el.addEventListener('click', () => {
          const pid = el.getAttribute('data-id');
          closeModal(root);
          openSaleModal(pid);
        });
      });
    }
  });
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  try{ await openDB(); }catch(e){ console.error('IndexedDB недоступен', e); }
  initSupabase();
  load();
  detectAuth();
  applyTheme();

  if(auth.isAdmin) state.ui.view = state.ui.view || 'dashboard';
  else state.ui.view = 'guest';

  render();
  hydrateSvg(document);

  if(supabase){
    updateOnlineState();
    const ok = await supabaseLoadAll();
    if(ok){ render(); hydrateSvg(document); }
    subscribeRealtime();
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if(state.settings.theme === 'system') applyTheme();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && modalStack.length) closeModal();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
